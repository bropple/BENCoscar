# BENCO CI.
#
# This is a SEPARATE workflow from upstream's `go.yml` on purpose. Upstream's
# only triggers on `main`, so it never fires on our `benco` branch — leaving it
# untouched means it never conflicts on a rebase, which is the fork discipline
# in CLAUDE.md ("new files rebase almost free").
#
# Same checks as upstream, minus the Codecov upload (that needs a token tied to
# mk6i's account, and a coverage number for a fork is not interesting).

name: BENCO CI

on:
  push:
    branches: ["benco"]
  pull_request:
    branches: ["benco"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Tracks the toolchain in go.mod rather than pinning separately, so a
          # future upstream Go bump doesn't need an edit here too.
          go-version-file: go.mod
          cache: true

      - name: Go Format
        run: |
          gofmt -s -l .
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then exit 1; fi

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Go Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      # Upstream's suite is the regression net for the ~95% of this codebase we
      # did not write. It stays green; never delete a test to make a change pass.
      #
      # -timeout is raised from Go's 10-minute default because the state package
      # is genuinely slow, and was already slow before BENCO touched it. It
      # builds a real SQLite database — running every migration — close to a
      # hundred times, and it is I/O-bound rather than CPU-bound: a local run
      # measured 578s wall for only 386s of user time, the rest being fsync wait.
      #
      # 578s against a 600s default is why this went red. The margin was always
      # razor thin; argon2id added enough to cross it. The failure presents as an
      # opaque "exit code 1" with no mention of a timeout, which is worth knowing
      # before debugging the wrong thing.
      #
      # Measure on a real filesystem if you re-check this. The same suite runs in
      # 341s from /tmp, because /tmp is tmpfs and the fsyncs become free — which
      # makes tmpfs timings useless for predicting CI.
      - name: Test
        run: go test -race -timeout 40m ./...
